services:
  postgres:
    image: postgres:latest
    container_name: tender-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tender_ai
      POSTGRES_USER: tender_user
      POSTGRES_PASSWORD: 123456
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tender_user -d tender_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: